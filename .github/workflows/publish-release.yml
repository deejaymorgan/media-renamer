name: publish v1.3.0

# One-off: publishes the release candidate that run 37931406316 built and
# tested, byte for byte, as v1.3.0 on main @ 87b79ec. It does not rebuild.
# Delete this file once the release exists.

on:
  push:
    branches:
      - claude/stoic-fermi-ilcpzl
    paths:
      - .github/workflows/publish-release.yml

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.3.0
      TARGET: 87b79ecf66fa80912574cb37cecf6abb09262b71
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: MediaRenamer-release-candidate
          run-id: 37931406316
          github-token: ${{ github.token }}
          path: dist

      - name: Verify the files are the ones that were tested
        working-directory: dist
        run: |
          ls -l
          sha256sum -c <<'SUMS'
          63d2c3f4190674404593554c1e3153f8acd15df17000c68bc9904e8c3b5148e4  MediaRenamer-unsigned.zip
          868b197ba1827a6cec82318872020f7d721d387b80c965408b2cef49bde76fbe  MediaRenamer-1.3.0.dmg
          SUMS

      - name: Refuse if the tag already exists
        run: |
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists"; exit 1
          fi

      - name: Create the release
        run: |
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET" \
            --title "Media Renamer 1.3.0" \
            --notes-file .github/release-notes/v1.3.0.md \
            --latest \
            dist/MediaRenamer-1.3.0.dmg dist/MediaRenamer-unsigned.zip
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"
